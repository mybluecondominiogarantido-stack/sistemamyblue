# Roda os testes automáticos (npm test) a cada push e a cada pull request.
# Os testes usam o Postgres embutido e HTMLs sintéticos: nenhum dado real nem segredo é necessário.
name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
