<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Portal MyBlue</title>
<link rel="icon" type="image/png" href="/img/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilos.css?v=4">
</head>
<body>
<div class="tela-login">
  <section class="login-arte" aria-hidden="true">
    <img src="/img/login-capa.jpg" alt="" width="1800" height="1009">
  </section>

  <section class="login-form">
    <div class="login-card">
      <img class="logo" src="/img/logo.png" alt="MyBlue">

      <form id="fLogin" class="pilha" novalidate>
        <div>
          <h2>Entrar</h2>
          <p class="sub">Use o e-mail e a senha fornecidos pela administração.</p>
        </div>
        <div id="msg" class="msg erro" role="alert" hidden></div>
        <div>
          <label class="rot" for="email">E-mail</label>
          <input class="campo" id="email" name="email" type="email" autocomplete="username" required autofocus>
        </div>
        <div>
          <label class="rot" for="senha">Senha</label>
          <div class="campo-senha"><input class="campo" id="senha" name="senha" type="password" autocomplete="current-password" required><button type="button" class="ver-senha" data-alvo="senha" aria-label="Mostrar senha" title="Mostrar senha"></button></div>
        </div>
        <button class="btn primary" type="submit" id="btEntrar" style="width:100%;padding:12px">Entrar</button>
        <p class="ajuda" style="text-align:center">Esqueceu a senha? Peça para a administração redefinir.</p>
      </form>

      <form id="fTroca" class="pilha" novalidate hidden>
        <div>
          <h2>Crie sua senha</h2>
          <p class="sub">É seu primeiro acesso ou sua senha foi redefinida. Escolha uma senha nova para continuar.</p>
        </div>
        <div id="msg2" class="msg erro" role="alert" hidden></div>
        <div>
          <label class="rot" for="nova">Nova senha</label>
          <div class="campo-senha"><input class="campo" id="nova" type="password" autocomplete="new-password" required><button type="button" class="ver-senha" data-alvo="nova" aria-label="Mostrar senha" title="Mostrar senha"></button></div>
          <div class="ajuda">Pelo menos 8 caracteres, com letras e números.</div>
        </div>
        <div>
          <label class="rot" for="nova2">Repita a nova senha</label>
          <div class="campo-senha"><input class="campo" id="nova2" type="password" autocomplete="new-password" required><button type="button" class="ver-senha" data-alvo="nova2" aria-label="Mostrar senha" title="Mostrar senha"></button></div>
        </div>
        <button class="btn primary" type="submit" style="width:100%;padding:12px">Salvar e entrar</button>
      </form>
    </div>
  </section>
</div>
<script src="/login.js?v=3"></script>
</body>
</html>
