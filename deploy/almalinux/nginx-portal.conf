# Portal MyBlue atrás do Nginx (AlmaLinux 9).
# Copie para /etc/nginx/conf.d/portal-myblue.conf, troque portal.myblue.com.br pelo domínio
# e rode "certbot --nginx -d <domínio> --redirect": o certbot acrescenta o HTTPS neste mesmo bloco.

# Algumas ferramentas gravam dados pela URL (JSONP, como no Apps Script): o portal aceita
# cabeçalhos de até 512 KB e o Nginx precisa aceitar o mesmo (o padrão dele é 8 KB).
large_client_header_buffers 8 512k;

upstream portal_myblue {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.myblue.com.br;

    # Vídeos dos tutoriais vão até 150 MB, HTMLs das ferramentas até 40 MB
    client_max_body_size 200m;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://portal_myblue;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffer_size 64k;
        proxy_buffers 16 64k;
    }
}
