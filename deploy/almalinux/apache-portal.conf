# Alternativa ao Nginx: Portal MyBlue atrás do Apache (httpd) no AlmaLinux 9.
# Use só um dos dois. Copie para /etc/httpd/conf.d/portal-myblue.conf, troque o domínio
# e rode "certbot --apache -d <domínio> --redirect".

<VirtualHost *:80>
    ServerName portal.myblue.com.br

    # Cabeçalhos de até 512 KB (ferramentas que gravam pela URL) e envios de até 200 MB
    LimitRequestFieldSize 524288
    LimitRequestLine 524288
    LimitRequestBody 209715200

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300
    ProxyPass        / http://127.0.0.1:3000/ keepalive=On
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

    ErrorLog  /var/log/httpd/portal-myblue-erro.log
    CustomLog /var/log/httpd/portal-myblue-acesso.log combined
</VirtualHost>
